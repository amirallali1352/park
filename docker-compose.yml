services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stp_os
      POSTGRES_USER: stp_os
      POSTGRES_PASSWORD: change-me
    ports:
      - "15432:5432"
    volumes:
      - stp-postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stp_os -d stp_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stp-postgres-data:
