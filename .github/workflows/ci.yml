name: STP OS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stp-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run test suite
        run: npm test

      - name: Start API for operational performance check
        run: |
          AUTH_SECRET=stp-os-ci-secret-2026 npm start > /tmp/stp-os-api.log 2>&1 &
          sleep 2

      - name: Run operational performance check
        env:
          AUTH_SECRET: stp-os-ci-secret-2026
          OPERATIONS_TOTAL: 10
          OPERATIONS_CONCURRENCY: 2
        run: npm run perf:operations
